<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    <nav>
        <a href="index.html">JavaScript Basics</a>
        <a href="part2.html">DOM Manipulation</a>
        <a href="part3.html">Events</a>

    <h2>Task 5</h2>
    <div id="box" onmouseover="changeColor()" onmouseout="resetColor()" style="width: 200px; height: 200px; background-color: gray;">
    </div>
    <h2>Task 6</h2>
    <input type="text" id="textInput" onkeyup="showText()" placeholder="Type something">
    <p id="inputResult"></p>
    <h2>Task 7</h2>
    <input type="number" id="firstNumber" placeholder="First number" step="any">
    <input type="number" id="secondNumber" placeholder="Second number" step="any"><br><br>
    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">-</button>
    <button onclick="calculate('*')">*</button>
    <button onclick="calculate('/')">/</button>
    <p id="calcResult"></p>
    <script src="events.js"></script>
</body>
</html>
